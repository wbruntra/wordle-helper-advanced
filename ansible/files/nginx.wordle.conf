server {
  listen 80;
  server_name wordle.bruntrager.win;
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name wordle.bruntrager.win;

  ssl_certificate /etc/letsencrypt/live/chat.bruntrager.win/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chat.bruntrager.win/privkey.pem;

  location /api {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # this line is required
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /home/william/wordle-helper-advanced/client/dist;
    try_files $uri $uri/ /index.html;
  }
}
