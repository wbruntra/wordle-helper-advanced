---
# wordle.bruntrager.win on gaybor_new. Requests go
# nginx -> waker (127.0.0.1:8000, ~/sysperf/waker) -> wordle-helper-api (app_port).
# waker starts and stops the pm2 process on demand, so it may be stopped
# between deploys; the restart step starts it either way.
# nginx serves client/dist statically (ansible/files/nginx.wordle.conf).
project_root: /home/william/wordle-helper-advanced
target_branch: master
# Must match pm2_name in ~/sysperf/waker/apps.config.ts.
pm2_name: wordle-helper-api
pm2_node_version: v24.12.0
# Must match PORT in ecosystem.config.cjs and the wordle entry in
# ~/sysperf/waker/apps.config.ts.
app_port: 3001
public_url: https://wordle.bruntrager.win
db_file: wordle.sqlite3
