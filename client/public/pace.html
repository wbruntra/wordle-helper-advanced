<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pace Converter</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #6a737d;
      --accent: #2563eb;
      --border: #dde1e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b2027;
        --text: #e8eaed;
        --muted: #9aa4af;
        --accent: #60a5fa;
        --border: #2c333d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .speed-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    button {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    button:active { background: var(--border); }
    .speed input {
      width: 5ch;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 48px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
      padding: 0;
    }
    .speed input:focus { outline: 2px solid var(--accent); border-radius: 8px; }
    .unit { color: var(--muted); font-size: 15px; margin-top: 2px; }
    input[type="range"] {
      width: 100%;
      margin: 20px 0 24px;
      accent-color: var(--accent);
    }
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .result {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 8px;
    }
    .result .value {
      font-size: 30px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    .result .label { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .detail { color: var(--muted); font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Speed → Pace</h1>

    <div class="speed-row">
      <button id="minus" aria-label="Decrease speed by 0.1">−</button>
      <div class="speed">
        <input id="speed" type="text" inputmode="decimal" value="8.0" aria-label="Speed in km/h" />
        <div class="unit">km/h</div>
      </div>
      <button id="plus" aria-label="Increase speed by 0.1">+</button>
    </div>

    <input id="slider" type="range" min="3" max="25" step="0.1" value="8" aria-label="Speed slider" />

    <div class="results">
      <div class="result">
        <div class="value" id="perKm">7:30</div>
        <div class="label">min / km</div>
      </div>
      <div class="result">
        <div class="value" id="perMile">12:04</div>
        <div class="label">min / mile</div>
      </div>
    </div>

    <div class="detail" id="detail"></div>
  </main>

  <script>
    const KM_PER_MILE = 1.609344;
    const MIN = 0.1, MAX = 50;

    const speedInput = document.getElementById('speed');
    const slider = document.getElementById('slider');
    const perKmEl = document.getElementById('perKm');
    const perMileEl = document.getElementById('perMile');
    const detailEl = document.getElementById('detail');

    let speed = 8.0;

    function formatPace(totalSeconds) {
      const s = Math.round(totalSeconds);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = String(s % 60).padStart(2, '0');
      return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
    }

    function describe(totalSeconds) {
      const s = Math.round(totalSeconds);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      const parts = [];
      if (m) parts.push(`${m} minute${m === 1 ? '' : 's'}`);
      if (sec || !m) parts.push(`${sec} second${sec === 1 ? '' : 's'}`);
      return parts.join(' ');
    }

    function setSpeed(value, { fromInput = false } = {}) {
      if (!Number.isFinite(value)) return;
      speed = Math.min(MAX, Math.max(MIN, Math.round(value * 10) / 10));

      const secPerKm = 3600 / speed;
      const secPerMile = secPerKm * KM_PER_MILE;

      perKmEl.textContent = formatPace(secPerKm);
      perMileEl.textContent = formatPace(secPerMile);
      detailEl.textContent = `1 km in ${describe(secPerKm)} · ${(speed / KM_PER_MILE).toFixed(2)} mph`;

      slider.value = speed;
      if (!fromInput) speedInput.value = speed.toFixed(1);
    }

    function step(delta) { setSpeed(speed + delta); }

    // Press-and-hold repeat for the +/- buttons
    function bindHold(button, delta) {
      let timer, interval;
      const stop = () => { clearTimeout(timer); clearInterval(interval); };
      button.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        step(delta);
        timer = setTimeout(() => { interval = setInterval(() => step(delta), 70); }, 400);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => button.addEventListener(ev, stop));
      button.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(delta); }
      });
    }
    bindHold(document.getElementById('minus'), -0.1);
    bindHold(document.getElementById('plus'), 0.1);

    slider.addEventListener('input', () => setSpeed(parseFloat(slider.value)));

    speedInput.addEventListener('input', () => {
      const v = parseFloat(speedInput.value.replace(',', '.'));
      if (v > 0) setSpeed(v, { fromInput: true });
    });
    speedInput.addEventListener('blur', () => { speedInput.value = speed.toFixed(1); });
    speedInput.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') { e.preventDefault(); step(0.1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); step(-0.1); }
      if (e.key === 'Enter') speedInput.blur();
    });

    // Arrow keys work anywhere on the page
    document.addEventListener('keydown', (e) => {
      if (e.target === speedInput || e.target === slider) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); step(0.1); }
      if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); step(-0.1); }
    });

    setSpeed(speed);
  </script>
</body>
</html>
